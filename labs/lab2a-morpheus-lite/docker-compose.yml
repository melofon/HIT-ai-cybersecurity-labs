services:
  redpanda:
    image: redpandadata/redpanda:v24.1.5
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster info --brokers=localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - morpheus-net

  redpanda-console:
    image: redpandadata/console:v2.6.1
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - morpheus-net

  triton:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    profiles:
      - triton
      - full
    command:
      - tritonserver
      - --model-repository=/models
    volumes:
      - ./models/model_repository:/models
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    restart: unless-stopped
    networks:
      - morpheus-net

networks:
  morpheus-net:
    driver: bridge
